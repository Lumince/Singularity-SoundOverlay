apply plugin: 'com.android.application'

android {
    namespace 'com.singularity.controlleroverlay'
    compileSdk 34

    defaultConfig {
        applicationId "com.singularity.controlleroverlay"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    aaptOptions {
        noCompress 'wav'
    }

    lint {
        checkReleaseBuilds false
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        outputFileName = "StartupSoundOverlay.apk"
    }
}
